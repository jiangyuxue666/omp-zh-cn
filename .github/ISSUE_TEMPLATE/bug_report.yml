name: Bug 反馈
description: 报告扩展加载失败、翻译错误或界面显示问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同 Issue。

  - type: input
    id: omp-version
    attributes:
      label: OMP 版本
      description: 可在 OMP 的版本信息中查看
      placeholder: 例如 18.12.6
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - Windows
        - 其他
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 解压到扩展目录
        - omp -e ./index.ts
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际显示与期望显示；涉及翻译问题时请附上原文和译文
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 OMP
        2. 执行 ...
        3. 看到 ...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认项
      options:
        - label: 已确认 index.ts、zh.json、settings-desc.json 直接位于 zh-cn 目录下
          required: true
        - label: 已重启 OMP，并执行过 /zh status
          required: true
